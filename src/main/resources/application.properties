spring.application.name=tenisu

server.port=${PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/api/v1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/tenisu}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/tenisu/protocol/openid-connect/certs}
